<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medware — Hero Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #070d18; overflow: hidden; height: 100%; }
  #root { position: fixed; inset: 0; display: grid; place-items: center; }
  /* Square stage: fills its container, scales the 1080 design to fit */
  .hero-frame { position: relative; width: min(100vw, 100vh); aspect-ratio: 1 / 1; overflow: hidden; border-radius: 28px; }
  .hero-canvas { position: absolute; top: 0; left: 0; width: 1080px; height: 1080px; transform-origin: top left; }
  a, a:hover { color: #38bdf8; }
  @keyframes twinkle { 0%, 100% { opacity: 0.18; } 50% { opacity: 0.75; } }
  @keyframes drift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(34px, 24px); } }
  @keyframes pulse-ring { 0% { transform: scale(0.7); opacity: 0.75; } 100% { transform: scale(1.5); opacity: 0; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="https://unpkg.com/lucide@0.474.0/dist/umd/lucide.min.js"></script>
<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="hero-loop.jsx"></script>

<script type="text/babel">
function HeroApp() {
  const frameRef = React.useRef(null);
  const [scale, setScale] = React.useState(1);
  React.useEffect(() => {
    const fit = () => {
      const el = frameRef.current;
      if (el) setScale(el.clientWidth / SQ);
    };
    fit();
    const ro = new ResizeObserver(fit);
    if (frameRef.current) ro.observe(frameRef.current);
    return () => ro.disconnect();
  }, []);
  return (
    <div className="hero-frame" ref={frameRef} style={{ '--acc1': '#38bdf8', '--acc2': '#0ea5e9', '--acc3': '#7dd3fc' }}>
      <div className="hero-canvas" style={{ transform: `scale(${scale})` }}>
        <HeroLoop></HeroLoop>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<HeroApp></HeroApp>);
</script>
</body>
</html>
