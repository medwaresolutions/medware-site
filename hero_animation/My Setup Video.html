<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Setup — One Person, Twenty Products</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #070d18; overflow: hidden; }
  .grad-text {
    background-image: linear-gradient(92deg, var(--acc2), var(--acc1) 50%, var(--acc3));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
  }
  @keyframes twinkle { 0%, 100% { opacity: 0.18; } 50% { opacity: 0.75; } }
  @keyframes drift {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(40px, 28px); }
  }
  @keyframes pulse-ring {
    0% { transform: scale(0.6); opacity: 0.8; }
    100% { transform: scale(1.6); opacity: 0; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="scenes-a.jsx"></script>
<script type="text/babel" src="scenes-b.jsx"></script>
<script type="text/babel" src="scenes-c.jsx"></script>
<script type="text/babel" src="scenes-d.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": [
    "#38bdf8",
    "#0ea5e9",
    "#7dd3fc"
  ],
  "captions": true,
  "showPrice": true
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const acc = Array.isArray(t.accent) ? t.accent : ["#38bdf8", "#0ea5e9", "#7dd3fc"];
  const settings = React.useMemo(() => ({ captions: t.captions, showPrice: t.showPrice }), [t.captions, t.showPrice]);
  return (
    <div style={{ position: 'fixed', inset: 0, '--acc1': acc[0], '--acc2': acc[1], '--acc3': acc[2] }}>
      <VideoSettings.Provider value={settings}>
        <Stage width={1920} height={1080} duration={T.duration} background="#070d18" loop={false} autoplay={false} persistKey="mysetup">
          <Backdrop></Backdrop>
          <SceneHook></SceneHook>
          <SceneTwoThings></SceneTwoThings>
          <SceneThreeParts></SceneThreeParts>
          <SceneNebula></SceneNebula>
          <SceneConstellation></SceneConstellation>
          <SceneViews></SceneViews>
          <SceneInterlude></SceneInterlude>
          <SceneTeam></SceneTeam>
          <SceneHierarchy></SceneHierarchy>
          <SceneTaskFlow></SceneTaskFlow>
          <SceneGlue></SceneGlue>
          <SceneInOut></SceneInOut>
          <SceneClosing></SceneClosing>
          <AudioSync src="uploads/ElevenLabs_my_set_up.mp3"></AudioSync>
          <TimecodeLabel></TimecodeLabel>
        </Stage>
      </VideoSettings.Provider>
      <TweaksPanel>
        <TweakSection label="Theme"></TweakSection>
        <TweakColor label="Accent" value={t.accent}
          options={[["#38bdf8", "#0ea5e9", "#7dd3fc"], ["#34d399", "#10b981", "#6ee7b7"], ["#fbbf24", "#f59e0b", "#fde68a"]]}
          onChange={(v) => setTweak('accent', v)}></TweakColor>
        <TweakSection label="Overlays"></TweakSection>
        <TweakToggle label="Captions" value={t.captions} onChange={(v) => setTweak('captions', v)}></TweakToggle>
        <TweakToggle label="$300/mo price chip" value={t.showPrice} onChange={(v) => setTweak('showPrice', v)}></TweakToggle>
      </TweaksPanel>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App></App>);
</script>
</body>
</html>
